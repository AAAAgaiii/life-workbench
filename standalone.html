<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f6ef7">
<title>我的生活工作台</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="生活工作台">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f6ef7'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white'>台</text></svg>">
<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #1c2333;
  --text2: #6b7280;
  --line: #e6e9f2;
  --primary: #4f6ef7;
  --primary-soft: #eef1fe;
  --green: #16a34a;
  --red: #e11d48;
  --orange: #f59e0b;
  --teal: #0d9488;
  --purple: #8b5cf6;
  --radius: 16px;
  --shadow: 0 2px 10px rgba(28, 35, 51, 0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea {
  font-family: inherit; font-size: 14px; color: var(--text);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
  background: #fff; outline: none; width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,.12); }
::placeholder { color: #a8aebd; }

/* 布局 */
#app { display: flex; min-height: 100vh; }
.sidebar {
  width: 216px; background: var(--card); border-right: 1px solid var(--line);
  padding: 20px 12px; position: fixed; top: 0; bottom: 0; left: 0; z-index: 50;
  display: flex; flex-direction: column; overflow-y: auto;
}
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.logo .mark {
  width: 36px; height: 36px; border-radius: 11px; flex: none;
  background: linear-gradient(135deg, #4f6ef7, #8b5cf6);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 17px;
}
.logo .t1 { font-weight: 700; font-size: 15px; }
.logo .t2 { font-size: 11px; color: var(--text2); }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: 11px; color: var(--text2); font-size: 14px; width: 100%;
  margin-bottom: 2px; transition: all .15s;
}
.nav-item .ico { font-size: 16px; width: 20px; text-align: center; }
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.main { flex: 1; margin-left: 216px; padding: 24px 28px 90px; max-width: 1160px; }

/* 顶栏 */
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
.topbar h1 { font-size: 21px; font-weight: 700; }
.topbar .date { color: var(--text2); font-size: 13px; }
.sync-chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; color: var(--text2);
}
.sync-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: #cbd5e1; }
.sync-chip.on .dot { background: var(--green); }
.dl-btn {
  border: none; background: var(--primary); color: #fff; font-size: 13px; font-weight: 600;
  padding: 7px 13px; border-radius: 99px; cursor: pointer; margin-right: 8px; white-space: nowrap;
}
.dl-btn:hover { background: #3f5cf0; }
.dl-btn.ready { animation: dlPulse 1.6s infinite; }
@keyframes dlPulse { 0%,100% { box-shadow: 0 0 0 3px var(--primary-soft); } 50% { box-shadow: 0 0 0 6px var(--primary-soft); } }

/* 卡片与网格 */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; border: 1px solid var(--line); }
.card h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.card h3 .more { font-size: 12px; color: var(--primary); font-weight: 400; }
.grid { display: grid; gap: 16px; }
.grid.cols-2 { grid-template-columns: 1fr 1fr; }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
/* 仪表盘可拖拽布局：display 仅在 .active 时生效，避免 ID 选择器优先级压过 .section 的隐藏规则 */
#sec-dashboard.active { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
#sec-dashboard .span2 { grid-column: span 2; }
#sec-dashboard .span4 { grid-column: 1 / -1; }
#sec-dashboard [data-dash] { cursor: grab; transition: box-shadow .15s, transform .15s; }
#sec-dashboard [data-dash]:hover { box-shadow: 0 6px 18px rgba(79,110,247,.18); }
#sec-dashboard [data-dash]:active { cursor: grabbing; }
#sec-dashboard [data-dash].dragging { opacity: .45; }
@media (max-width: 760px) {
  #sec-dashboard.active { grid-template-columns: 1fr 1fr; }
  #sec-dashboard .span2, #sec-dashboard .span4 { grid-column: 1 / -1; }
}
.section { display: none; }
.section.active { display: block; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

/* 统计块 */
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat .v { font-size: 22px; font-weight: 700; }
.stat .l { font-size: 12px; color: var(--text2); }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--primary); color: #fff; border-radius: 10px; padding: 9px 16px;
  font-size: 13px; font-weight: 600; transition: opacity .15s; flex: none;
}
.btn:hover { opacity: .88; }
.btn.ghost { background: var(--primary-soft); color: var(--primary); }
.btn.gray { background: var(--bg); color: var(--text2); border: 1px solid var(--line); }
.btn.danger { background: #fee2e2; color: var(--red); }
.btn.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.icon-btn { color: var(--text2); font-size: 15px; padding: 4px 6px; border-radius: 6px; }
.icon-btn:hover { background: var(--bg); color: var(--red); }

/* 表单行 */
.form-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.form-row > * { flex: 1; min-width: 90px; }
.form-row > .btn { flex: none; }
label.fl { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; }

/* 列表 */
.list-item {
  display: flex; align-items: center; gap: 10px; padding: 11px 4px;
  border-bottom: 1px solid var(--line);
}
.list-item:last-child { border-bottom: none; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .title { font-size: 14px; word-break: break-all; }
.list-item .sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.done .title { text-decoration: line-through; color: var(--text2); }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; flex: none; }
.tag.hi { background: #fee2e2; color: var(--red); }
.tag.mid { background: #fef3c7; color: #b45309; }
.tag.lo { background: #dcfce7; color: var(--green); }
.tag.blue { background: var(--primary-soft); color: var(--primary); }
.tag.teal { background: #ccfbf1; color: var(--teal); }
.tag.purple { background: #ede9fe; color: var(--purple); }
.tag.orange { background: #fef3c7; color: #b45309; }
.checkbox {
  width: 20px; height: 20px; border-radius: 7px; border: 2px solid #cbd5e1;
  flex: none; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; transition: all .15s;
}
.checkbox.on { background: var(--green); border-color: var(--green); }
.empty { text-align: center; color: #a8aebd; padding: 26px 0; font-size: 13px; }

/* 进度条 */
.pbar { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.pbar > div { height: 100%; border-radius: 99px; transition: width .3s; }

/* 月历 */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-head .m { font-size: 16px; font-weight: 700; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-wd { text-align: center; font-size: 12px; color: var(--text2); padding: 6px 0; }
.cal-cell {
  min-height: 72px; border-radius: 10px; padding: 6px; font-size: 12px;
  border: 1px solid transparent; cursor: pointer; overflow: hidden;
}
.cal-cell:hover { background: var(--bg); }
.cal-cell.dim { opacity: .35; }
.cal-cell.today { background: var(--primary-soft); border-color: var(--primary); }
.cal-cell.sel { border-color: var(--primary); }
.cal-cell .d { font-weight: 600; margin-bottom: 3px; }
.cal-ev {
  font-size: 10px; background: var(--primary-soft); color: var(--primary);
  border-radius: 4px; padding: 1px 4px; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cal-ev.todo { background: #fef3c7; color: #b45309; }
.cal-dots { display: flex; gap: 2px; flex-wrap: wrap; }

/* 饮食 */
.macro-ring { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.meal-group-title { font-size: 13px; font-weight: 700; color: var(--text2); margin: 12px 0 2px; }
.food-suggest {
  position: absolute; z-index: 30; background: #fff; border: 1px solid var(--line);
  border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.1); max-height: 220px; overflow-y: auto;
  width: 100%; top: calc(100% + 4px); left: 0;
}
.food-suggest div { padding: 9px 12px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; }
.food-suggest div:hover { background: var(--primary-soft); }
.food-suggest .m { color: var(--text2); font-size: 11px; }
.ai-zone {
  border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center;
  color: var(--text2); font-size: 13px; cursor: pointer; transition: all .15s;
}
.ai-zone:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

/* 打卡热力 */
.streak-grid { display: flex; gap: 4px; flex-wrap: wrap; }
.streak-cell { width: 11%; aspect-ratio: 1; max-width: 34px; border-radius: 6px; background: var(--bg); position: relative; }
.streak-cell.on { background: var(--green); }
.streak-cell span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--text2); }
.streak-cell.on span { color: #fff; }

/* 热点 */
.hot-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.hot-tab { padding: 7px 14px; border-radius: 99px; background: var(--bg); font-size: 13px; color: var(--text2); }
.hot-tab.active { background: var(--primary); color: #fff; }
.hot-item { display: flex; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); align-items: baseline; }
.hot-item:last-child { border: none; }
.hot-rank { font-weight: 800; font-style: italic; width: 24px; flex: none; color: #94a3b8; }
.hot-item:nth-child(1) .hot-rank { color: var(--red); }
.hot-item:nth-child(2) .hot-rank { color: var(--orange); }
.hot-item:nth-child(3) .hot-rank { color: #eab308; }
.hot-item a { color: var(--text); text-decoration: none; font-size: 14px; flex: 1; }
.hot-item a:hover { color: var(--primary); }
.hot-heat { font-size: 11px; color: var(--text2); flex: none; }

/* 弹窗 & toast */
.modal-bg {
  position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal { background: #fff; border-radius: 18px; padding: 22px; width: 100%; max-width: 460px; max-height: 86vh; overflow-y: auto; }
.guide-modal { max-width: 560px; }
.guide-fig { background: #f5f7ff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 6px 0 14px; }
.guide-fig svg { display: block; width: 100%; height: auto; }
.guide-cap { font-size: 11px; color: var(--text2); text-align: center; margin-top: 6px; }
.guide-step { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.guide-step:last-of-type { border-bottom: none; }
.guide-step .n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.guide-step .ico { flex: none; font-size: 16px; line-height: 1.4; }
.guide-step .body { font-size: 13px; line-height: 1.7; color: var(--text); }
.guide-step .body code, .sw-table code { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 11px; color: var(--primary); }
.guide-tip { margin-top: 10px; font-size: 12px; color: var(--text2); background: var(--bg); border-radius: 10px; padding: 10px 12px; line-height: 1.7; }
.sw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin: 8px 0 4px; }
.sw-card { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); }
.sw-card b { display: block; font-size: 13px; }
.sw-card span { font-size: 10px; color: var(--text2); word-break: break-all; }
.sw-table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 11px; }
.sw-table th, .sw-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.sw-table th { background: var(--bg); font-weight: 600; }
.sw-table code { display: inline-block; max-width: 230px; overflow: auto; }
.modal h3 { font-size: 16px; margin-bottom: 14px; }
#toast {
  position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-80px);
  background: #1c2333; color: #fff; padding: 10px 20px; border-radius: 99px;
  font-size: 13px; z-index: 200; transition: transform .3s; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  max-width: 88vw;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* 旅行计划 */
.chip {
  display: inline-block; font-size: 11px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 99px; padding: 2px 9px; margin: 2px 4px 2px 0; color: var(--text2);
}
.tl { position: relative; margin-top: 4px; }
.tl-item { position: relative; padding: 7px 0 7px 16px; border-left: 2px solid var(--line); margin-left: 5px; }
.tl-item::before {
  content: ""; position: absolute; left: -6px; top: 13px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--primary); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line);
}
.tl-item.transit::before { width: 6px; height: 6px; left: -4px; top: 15px; background: #cbd5e1; }
.tl-item:last-child { border-left-color: transparent; }

/* 图表 */
.chart-wrap { width: 100%; overflow-x: auto; }
svg text { font-family: inherit; }

/* 移动端 */
.bottom-nav { display: none; }
@media (max-width: 900px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 16px 14px 92px; }
  .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr 1fr; }
  .grid.cols-2 { grid-template-columns: 1fr; }
  .topbar h1 { font-size: 18px; }
  .cal-cell { min-height: 52px; padding: 4px; }
  .cal-ev { display: none; }
  .cal-dots { display: flex; }
  .bottom-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
    background: rgba(255,255,255,.94); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    overflow-x: auto;
  }
  .bnav-item {
    flex: 1; min-width: 58px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 10px; color: var(--text2); padding: 4px 0; border-radius: 10px;
  }
  .bnav-item .ico { font-size: 18px; }
  .bnav-item.active { color: var(--primary); font-weight: 600; }
}
@media (min-width: 901px) {
  .cal-dots { display: none; }
}

/* ===== 新增：顶栏图标按钮 / 备份横幅 / 悬浮快速记录 ===== */
.top-icon {
  width: 34px; height: 34px; border-radius: 50%; font-size: 15px; flex: none;
  background: var(--card); border: 1px solid var(--line); display: inline-flex;
  align-items: center; justify-content: center;
}
.top-icon:hover { border-color: var(--primary); }
.backup-banner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: #fff7ed; border: 1px solid #fdba74; color: #9a3412;
  border-radius: 12px; padding: 9px 14px; font-size: 13px; margin-bottom: 16px;
}
.backup-banner span { flex: 1; min-width: 180px; }
.corrupt-banner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: #fef2f2; border: 1px solid #f87171; color: #991b1b;
  border-radius: 12px; padding: 9px 14px; font-size: 13px; margin-bottom: 16px; line-height: 1.6;
}
.corrupt-banner code { background: rgba(0,0,0,.08); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.fab {
  position: fixed; right: 22px; bottom: 26px; z-index: 70;
  width: 52px; height: 52px; border-radius: 50%; font-size: 26px; line-height: 1;
  background: var(--primary); color: #fff; box-shadow: 0 4px 16px rgba(79,110,247,.4);
  display: flex; align-items: center; justify-content: center;
}
.fab:hover { background: #3f5cf0; transform: scale(1.06); }
@media (max-width: 900px) { .fab { bottom: calc(74px + env(safe-area-inset-bottom)); right: 16px; } }

/* ===== 新增：全年学习热力图 ===== */
.hm-wrap { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.hm-col { display: flex; flex-direction: column; gap: 3px; }
.hm-cell { width: 12px; height: 12px; border-radius: 3px; background: var(--bg); flex: none; }
.hm-cell.lv0 { background: var(--bg); }
.hm-cell.lv1 { background: #bbf7d0; }
.hm-cell.lv2 { background: #4ade80; }
.hm-cell.lv3 { background: #16a34a; }
.hm-cell.lv4 { background: #14532d; }
.hm-cell.lvx { background: transparent; border: 1px dashed var(--line); }

/* ===== 新增：深色主题 ===== */
[data-theme="dark"] {
  --bg: #12141c;
  --card: #1c1f2b;
  --text: #e6e9f2;
  --text2: #9aa1b5;
  --line: #2c3040;
  --primary: #6d86ff;
  --primary-soft: #232a45;
  --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
}
[data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea { background: #171a24; color: var(--text); }
[data-theme="dark"] ::placeholder { color: #5d6478; }
[data-theme="dark"] .backup-banner { background: #2b2010; border-color: #92600e; color: #fbbf24; }
[data-theme="dark"] .corrupt-banner { background: #3a1d1d; border-color: #b91c1c; color: #fca5a5; }
[data-theme="dark"] .hm-cell.lv1 { background: #14532d; }
[data-theme="dark"] .hm-cell.lv2 { background: #15803d; }
[data-theme="dark"] .hm-cell.lv3 { background: #22c55e; }
[data-theme="dark"] .hm-cell.lv4 { background: #86efac; }
[data-theme="dark"] .streak-cell.on span { color: #12141c; }
@media (max-width: 900px) {
  [data-theme="dark"] .bottom-nav { background: rgba(22,25,35,.94); }
}

/* ===== 高对比模式（强化可读） ===== */
.contrast {
  --bg: #000000; --card: #0a0a0a; --text: #ffffff; --text2: #e8e8e8;
  --line: #ffffff; --primary: #ffeb3b; --primary-soft: #2a2a00;
  --shadow: none; --green: #00e676; --red: #ff5252; --orange: #ffab00;
  --teal: #18ffff; --purple: #e040fb; --blue: #40c4ff; --pink: #ff4081;
}
.contrast .card { border: 2px solid #fff; }
.contrast .btn { border: 2px solid #fff; font-weight: 600; }
.contrast .btn.gray, .contrast .btn.ghost { border-color: #fff; }
.contrast input, .contrast select, .contrast textarea { background: #000; color: #fff; border: 2px solid #fff; }
.contrast a { color: #ffeb3b; }
.contrast .pbar { background: #333; }
.contrast .pbar > div { outline: 1px solid #000; }
.contrast .tag, .contrast .chip { border: 1px solid #fff; }
.contrast .bottom-nav { background: #000; border-top: 2px solid #fff; }
.contrast .nav-item.active { color: #ffeb3b; }
.contrast .modal-bg, .contrast.modal-bg { background: rgba(0,0,0,.85); }
.contrast .modal { background: #000; border: 2px solid #fff; }
/* AI 复盘 markdown 渲染 */
.md { font-size: 14px; line-height: 1.85; color: var(--text); }
.md h3 { font-size: 16px; margin: 14px 0 6px; }
.md h4 { font-size: 14px; margin: 12px 0 4px; color: var(--text); }
.md h5 { font-size: 13px; margin: 10px 0 4px; color: var(--text2); }
.md p { margin: 6px 0; }
.md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.md li { margin: 3px 0; }
.md b { color: var(--text); }
/* ===== 小工具页 ===== */
.tools-page { padding: 0 4px; }
.tools-intro { text-align: center; color: var(--text2); font-size: 13px; margin: 8px 0 16px; }
.tools-cat { margin-bottom: 24px; }
.tools-cat-title { font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 10px; padding-left: 4px; }
.tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.tool-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: all .2s; color: var(--text); }
.tool-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(79,110,247,.15); }
.tool-card.active { border-color: var(--primary); background: #e8eeff; }
[data-theme="dark"] .tool-card.active { background: rgba(79,110,247,.18); }
.tool-ico { font-size: 32px; line-height: 1; }
.tool-name { font-weight: 700; font-size: 14px; }
.tool-desc { font-size: 11.5px; color: var(--text2); text-align: center; }
.tool-panel { margin-top: 20px; background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 20px; animation: gfIn .25s ease; }
.tool-body { max-width: 560px; margin: 0 auto; }
.tool-body h3 { margin: 0 0 6px; font-size: 18px; }
.tool-sub { color: var(--text2); font-size: 13px; margin: 4px 0 12px; }
.tool-result { margin-top: 14px; text-align: center; display: none; }

/* 抽签/转盘结果 */
.lot-animate { font-size: 28px; font-weight: 900; color: var(--primary); padding: 20px; animation: lotBounce .08s infinite alternate; }
.lot-winner { font-size: 26px; font-weight: 900; color: var(--primary); padding: 22px; background: linear-gradient(135deg,#e8eeff,#f0e6ff); border-radius: 14px; }
@keyframes lotBounce { from { transform: scale(1.05) rotate(-1deg); } to { transform: scale(.95) rotate(1deg); } }

/* 骰子 */
.dice-area { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
.dice { width: 58px; height: 58px; background: var(--card); border: 2px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: var(--text); cursor: pointer; position: relative; user-select: none; transition: transform .15s; }
.dice.rolled { background: #fff8e1; border-color: #ffc107; }
.dice .dot { position: absolute; width: 9px; height: 9px; background: #333; border-radius: 50%; transform: translate(-50%,-50%); }

/* 硬币 */
.coin-box { text-align: center; margin: 20px 0; perspective: 400px; }
.coin-el { width: 100px; height: 100px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; cursor: pointer;
  background: linear-gradient(145deg,#ffd700,#ffaa00); color: #7a6000; border: 3px solid #e6a800; box-shadow: 0 4px 16px rgba(255,170,0,.35); }
.coin-el.heads { background: linear-gradient(145deg,#e8f5e9,#81c784); color: #1b5e20; border-color: #4caf50; box-shadow: 0 4px 16px(76,175,80,.3); }
.coin-el.tails { background: linear-gradient(145deg,#ffebee,#ef5350); color: #b71c1c; border-color: #e53935; box-shadow: 0 4px 16px(239,83,80,.3); }
.coin-el.flipping { animation: coinFlip .9s ease-out; }
@keyframes coinFlip { 0%{transform:rotateY(0)} 50%{transform:rotateY(1800deg) scale(1.2)} 100%{transform:rotateY(3600deg) scale(1)} }

/* 决策器 */
.decide-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.decide-btn { padding: 18px 12px; border-radius: 14px; border: 2px solid var(--border); background: var(--card); font-size: 16px; cursor: pointer; transition: all .2s; color: var(--text); }
.decide-btn:hover { border-color: var(--primary); transform: translateY(-2px); }
.decide-big { grid-column: span 2; background: linear-gradient(135deg,var(--primary),#7c4dff); color: #fff !important; border-color: transparent; }

/* 时间屏幕 */
.ts-clock { font-size: 52px; font-weight: 200; text-align: center; letter-spacing: 3px; font-variant-numeric: tabular-nums; margin: 10px 0 4px; color: var(--text); }
.ts-date { text-align: center; font-size: 15px; color: var(--text2); margin-bottom: 12px; }
.ts-formats { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.ts-fmt { padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: transparent; color: var(--text2); font-size: 13px; cursor: pointer; }
.ts-fmt.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.timescreen-body.fs { position: fixed; inset: 0; z-index: 9999; background: #000; display: flex !important; flex-direction: column; align-items: center; justify-content: center; border-radius: 0; }
.timescreen-body.fs .ts-clock { font-size: min(18vw, 120px); color: #fff; }
.timescreen-body.fs .ts-date { color: rgba(255,255,255,.6); font-size: min(5vw, 24px); }
.timescreen-body.fs h3 { color: rgba(255,255,255,.5); }
.timescreen-body.fs .ts-formats { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); }
.timescreen-body.fs .ts-fmt { border-color: rgba(255,255,255,.3); color: rgba(255,255,255,.7); }
.timescreen-body.fs .ts-fmt.active { background: #fff; color: #000; }

/* 秒表 / 倒计时 / 番茄钟 */
.sw-display, .cd-display, .pomodoro-display { font-size: 48px; font-weight: 200; text-align: center; letter-spacing: 2px; font-variant-numeric: tabular-nums; padding: 16px; font-family: 'SF Mono', Consolas, monospace; color: var(--text); }
.pomodoro-phase { text-align: center; font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--primary); }
.sw-controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.sw-laps { max-height: 140px; overflow-y: auto; margin: 10px 0; font-size: 13px; font-family: 'SF Mono',Consolas,monospace; }
.sw-lap { padding: 4px 8px; border-bottom: 1px solid var(--border); }

/* 记分牌 */
.sb-board { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 16px 0; }
.sb-team { text-align: center; flex: 1; }
.sb-label { font-size: 14px; color: var(--text2); margin-bottom: 6px; }
.sb-score { font-size: 64px; font-weight: 900; color: var(--primary); line-height: 1; font-variant-numeric: tabular-nums; }
.sb-vs { font-size: 20px; font-weight: 900; color: var(--text2); }
.sb-btns { display: flex; gap: 4px; justify-content: center; margin-top: 8px; }

/* 手持弹幕 */
.led-preview { margin-top: 14px; border-radius: 10px; overflow: hidden; }

/* 计算器 */
.calc-display { background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; min-height: 54px; text-align: right; font-family:'SF Mono',Consolas,monospace;overflow:hidden;word-break:break-all}
.calc-display div:first-child { font-size: 14px; color: var(--text2); min-height: 20px; }
.calc-display div:last-child { font-size: 26px; font-weight: 700; color: var(--text); }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.calc-key { padding: 16px 4px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--card); font-size: 18px; cursor: pointer; transition: all .1s; color: var(--text); }
.calc-key:active { transform: scale(.95); }
.calc-key.op { background: #e8eeff; color: var(--primary); font-weight: 700; }
.calc-key.eq { background: var(--primary); color: #fff; font-weight: 700; }
.calc-key.clr { background: #ffebee; color: #c62828; }
.calc-key.num { font-weight: 500; }

/* 密码生成器 */
.pw-output { display: flex; align-items: center; gap: 8px; margin-top: 12px; background: var(--bg); padding: 12px 16px; border-radius: 10px; word-break: break-all; font-family:'SF Mono',Consolas,monospace;font-size:16px;letter-spacing:1px}

/* 取色器 */
.cp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.cp-row label { width: 36px; font-size: 13px; color: var(--text2); flex-shrink: 0; }
.cp-inp { flex: 1; font-family: 'SF Mono',Consolas,monospace; font-size: 13px; }

/* 设备信息 */
.di-table { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.di-row { display: flex; border-bottom: 1px solid var(--border); }
.di-row:last-child { border-bottom: none; }
.di-k { width: 100px; padding: 8px 12px; background: var(--bg); font-size: 13px; font-weight: 600; color: var(--text2); flex-shrink: 0; }
.di-v { padding: 8px 12px; font-size: 13px; word-break: break-all; color: var(--text); }

/* 首次进入自动浮层（图文指引） */
.guide-float {
  position: fixed; left: 12px; right: 12px; bottom: 76px; z-index: 60;
  display: none; align-items: center; gap: 10px;
  background: var(--card); border: 1px solid var(--primary);
  border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow);
  max-width: 460px; margin: 0 auto;
  animation: gfIn .25s ease;
}
@keyframes gfIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.guide-float .gf-ico { font-size: 22px; flex: none; }
.guide-float .gf-body { flex: 1; min-width: 0; }
.guide-float .gf-title { font-size: 13px; font-weight: 700; color: var(--text); }
.guide-float .gf-desc { font-size: 12px; color: var(--text2); line-height: 1.5; margin-top: 2px; }
.guide-float .btn.sm { flex: none; }
.guide-float .icon-btn { flex: none; }
@media (min-width: 768px) { .guide-float { left: 16px; right: auto; bottom: 84px; } }

/* 语音输入按钮 */
.voice-btn { width: 34px; height: 34px; flex: none; border-radius: 50%; border: 1.5px solid var(--border); background: var(--card); cursor: pointer; font-size: 15px; transition: all .15s; }
.voice-btn:hover { border-color: var(--primary); background: var(--primary-soft); }

/* 紧凑密度 */
body.compact { line-height: 1.4; }
body.compact .card { padding: 12px; margin-bottom: 10px; }
body.compact .card h3 { font-size: 15px; margin-bottom: 8px; }
body.compact .list-item { padding: 8px 0; }
body.compact .btn { padding: 7px 12px; }

/* 提醒状态 / 备份列表 */
#reminder-status:empty { display: none; }
#backup-list { font-size: 13px; }
#backup-list .btn.sm { padding: 3px 8px; }

/* 快捷键提示 */
.kbd { display: inline-block; padding: 1px 6px; border: 1px solid var(--border); border-radius: 5px; font-size: 11px; font-family: monospace; background: var(--bg); color: var(--text2); }

/* ===== 文件归档 ===== */
.file-drop { border: 2px dashed var(--border); border-radius: 12px; padding: 26px 16px; text-align: center; color: var(--text2); cursor: pointer; transition: background .15s, border-color .15s; background: var(--bg); }
.file-drop:hover { border-color: var(--primary); color: var(--text); }
.file-drop.over { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 12%, var(--bg)); color: var(--text); }
.file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.file-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.file-thumb-wrap { cursor: pointer; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.file-thumb { width: 100%; height: 120px; object-fit: cover; display: block; }
.file-thumb-icon { font-size: 44px; height: 120px; }
.file-meta { padding: 10px 12px 6px; flex: 1; }
.file-name { font-size: 13px; font-weight: 600; color: var(--text); word-break: break-all; line-height: 1.4; }
.file-sub { font-size: 11px; color: var(--text2); margin-top: 4px; }
.file-tags { font-size: 11px; color: var(--text2); margin-top: 4px; word-break: break-all; }
.file-actions { display: flex; gap: 6px; padding: 8px 10px 10px; flex-wrap: wrap; }
.file-actions .btn { flex: 1; min-width: 0; }
.file-pre { max-height: 60vh; overflow: auto; white-space: pre-wrap; word-break: break-all; font-size: 12px; line-height: 1.6; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); }

/* ===== 命令面板（Ctrl/Cmd+K） ===== */
.cmd-palette { position: fixed; inset: 0; z-index: 300; display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; font-family: inherit; }
.cmd-bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); }
.cmd-box { position: relative; width: min(92vw, 560px); background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); overflow: hidden; }
.cmd-input { width: 100%; border: none; border-bottom: 1px solid var(--border); padding: 16px 18px; font-size: 16px; background: var(--card); color: var(--text); outline: none; }
.cmd-list { max-height: 52vh; overflow: auto; padding: 6px; }
.cmd-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; cursor: pointer; font-size: 14px; color: var(--text); }
.cmd-item .cmd-ico { font-size: 17px; width: 22px; text-align: center; flex: none; }
.cmd-item.active, .cmd-item:hover { background: var(--primary-soft); }
.cmd-foot { font-size: 11px; color: var(--text2); padding: 8px 14px; border-top: 1px solid var(--border); }
.cmd-empty { padding: 18px; text-align: center; color: var(--text2); font-size: 13px; }

/* ===== 整体打卡热力图 ===== */
.heat-grid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
.heat-cell { aspect-ratio: 1 / 1; border-radius: 3px; background: var(--bg); }
.heat-cell.l1 { background: #cfe8cf; }
.heat-cell.l2 { background: #93d393; }
.heat-cell.l3 { background: #4caf50; }
.heat-cell.l4 { background: #2e7d32; }
[data-theme="dark"] .heat-cell { background: #15241a; }
[data-theme="dark"] .heat-cell.l1 { background: #1f4a2c; }
[data-theme="dark"] .heat-cell.l2 { background: #2f7d45; }
[data-theme="dark"] .heat-cell.l3 { background: #3fae5e; }
[data-theme="dark"] .heat-cell.l4 { background: #5fd47f; }

/* ===== 高对比模式强化 ===== */
.contrast .list-item { border: 1px solid #fff; }
.contrast .topbar { border-bottom: 2px solid #fff; }
.contrast .sidebar { border-right: 2px solid #fff; }
.contrast .section h3, .contrast .card h3 { border-bottom: 1px solid #fff; padding-bottom: 6px; }
.contrast .checkbox { border: 2px solid #fff; }
.contrast .cal-cell { border: 1px solid #fff; }
.contrast .heat-cell { border: 1px solid #fff; }
.contrast .sync-chip { border: 2px solid #fff; }
.contrast .cmd-box { border: 2px solid #fff; }
.contrast input.cmd-input { border-bottom: 2px solid #fff; }
.contrast .chart-wrap svg text { fill: #fff; }
.contrast .pbar > div { background: #ffeb3b !important; }
.contrast .cmd-item.active, .contrast .cmd-item:hover { background: #222; }
.contrast .cal-dots span { outline: 1px solid #000; }
@media (max-width: 560px) { .file-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }

/* ===== 小红书知识库模块（并入生活工作台） ===== */
.xhs-tool { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.xhs-tool .inp { flex: 1; min-width: 200px; }
.xhs-cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.xhs-cats .pill {
  border: 1px solid var(--line); background: var(--card); color: var(--text2);
  border-radius: 99px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  display: inline-flex; gap: 6px; align-items: center;
}
.xhs-cats .pill .muted { color: var(--text2); font-size: 11px; opacity: .8; }
.xhs-cats .pill.active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); font-weight: 600; }
.xhs-cats .pill:hover { border-color: var(--primary); }
.xhs-clear { margin-left: 6px; font-size: 11px; color: var(--text2); background: transparent; border: none; cursor: pointer; padding: 0 2px; }
.xhs-clear:hover { color: var(--red); }
.xhs-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; font-size: 13px; }
.xhs-tags .muted { color: var(--text2); }
.tag-chip {
  border: 1px solid var(--line); background: var(--card); color: var(--text2);
  border-radius: 99px; padding: 3px 10px; font-size: 12px; cursor: pointer;
  display: inline-flex; gap: 5px; align-items: center;
}
.tag-chip .c { background: var(--bg); color: var(--text2); border-radius: 99px; padding: 0 6px; font-size: 11px; }
.tag-chip.active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
.tag-chip:hover { border-color: var(--primary); }
.xhs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.xhs-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
}
.xhs-card-top { display: flex; justify-content: space-between; align-items: center; }
.xhs-cat { font-size: 12px; color: var(--primary); background: var(--primary-soft); border-radius: 99px; padding: 2px 10px; }
.xhs-card .icon-btn { font-size: 13px; }
.xhs-title { font-size: 15px; font-weight: 600; color: var(--text); text-decoration: none; line-height: 1.4; }
.xhs-title:hover { color: var(--primary); }
.xhs-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); }
.xhs-like { color: var(--red); }
.xhs-note {
  font-size: 13px; color: var(--text2); background: var(--bg); border-radius: 8px; padding: 8px 10px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.xhs-tags-in { display: flex; flex-wrap: wrap; gap: 6px; }
.xhs-tags-in .tag { font-size: 11px; background: var(--primary-soft); color: var(--primary); border-radius: 99px; padding: 2px 8px; cursor: pointer; }
.xhs-edit { align-self: flex-start; margin-top: 2px; }
/* 多选 / 批量 / 拖拽 */
.xhs-bulkbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; padding: 8px 10px; background: var(--primary-soft); border: 1px solid var(--primary); border-radius: var(--radius); }
.xhs-bulkbar .xhs-selall { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text); }
.xhs-bulkbar .muted { color: var(--text2); font-size: 12px; }
.xhs-card.multi { cursor: pointer; }
.xhs-card.selected { outline: 2px solid var(--primary); outline-offset: -2px; background: var(--primary-soft); }
.xhs-sel { width: 16px; height: 16px; cursor: pointer; }
.xhs-cats .pill.drag-over, .xhs-cats .pill.drag-over:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
.xhs-cats .pill.drag-over .muted { color: #fff; }
#xhs-multi-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
@media (max-width: 600px) { .xhs-grid { grid-template-columns: 1fr 1fr; } .xhs-tool .inp { min-width: 100%; } }

/* ---------- 养生/塔罗/道法新模块样式 ---------- */
.tarot-deck { width: 140px; height: 200px; margin: 0 auto; border-radius: 14px; background: linear-gradient(135deg, #4c1d95, #2e1065); box-shadow: 0 10px 30px rgba(76, 29, 149, .35); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: transform .25s ease, box-shadow .25s ease; }
.tarot-deck:hover { transform: translateY(-4px); box-shadow: 0 14px 36px rgba(76, 29, 149, .45); }
.tarot-deck.shuffling { animation: tarot-shuffle .55s ease-in-out 2; }
@keyframes tarot-shuffle { 0%, 100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-18px) rotate(-4deg); } 75% { transform: translateX(18px) rotate(4deg); } }
.tarot-back { width: 100%; height: 100%; border-radius: 14px; border: 2px dashed rgba(233, 213, 255, .35); display: flex; align-items: center; justify-content: center; color: rgba(233, 213, 255, .7); font-size: 18px; font-weight: 700; letter-spacing: 2px; }
.tarot-hint { position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: #d8b4fe; }
.tarot-face { width: 100%; height: 100%; border-radius: 14px; background: linear-gradient(180deg, #f3e8ff, #fff); color: #4c1d95; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px; text-align: center; transition: transform .6s ease; box-shadow: 0 4px 20px rgba(76, 29, 149, .25); }
.tarot-face.reversed { transform: rotate(180deg); }
.tarot-name { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
.tarot-keyword { font-size: 12px; color: #7c3aed; line-height: 1.4; }
.coin-stage { text-align: center; }
.coin-hint { font-size: 12px; color: var(--text2); margin-bottom: 14px; }
.coin-row { display: inline-flex; gap: 10px; cursor: pointer; }
.tao-coin { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #d97706, #b45309); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; box-shadow: 0 4px 12px rgba(217, 119, 6, .35); transition: transform .2s ease; }
.tao-coin:hover { transform: translateY(-3px); }
.coin-stage.casting .tao-coin { animation: coin-flip .45s ease-in-out 3; }

<script>
/* ===================== 旅行计划模块 ===================== */
"use strict";

/* ---------- 状态 ---------- */
let travelView = "home";      // home | detail
let curTripId = null;
let planLoading = false;
let spotLoadingId = null;

const TRIP_MONEY_CATS = ["门票", "交通", "餐饮", "住宿", "购物", "娱乐", "其他"];
const TL_ICONS = { arrive: "🛬", depart: "🛫", checkin: "🏨", spot: "🏞️", transit: "🚏", meal: "🍜", free: "☕" };

/* ---------- 定位 / 地图 / 附近推荐 状态 ---------- */
let userLoc = null;          // {lat,lng,acc,ts}
let nearbyRes = null;        // {list, far, kw, cat, radius} | {notice:'needKey'} | {error}
let nearbyLoading = false;
let nearbyCtg = "food";      // food | spot | kw
let nearbyKw = "";           // “我想吃”自定义关键词
let nearbyRadius = 2000;     // 搜索半径(米)
let nearbyWalkOnly = false;  // 只显示步行可达(<1km)
const mapInstances = {};     // 容器id -> TMap 实例
const geoCache = {};         // 城市|名称 -> {lat,lng}


/* ---------- 工具 ---------- */
function tripById(id) { return (D.trips || []).find((t) => t.id === id); }
function tripDates(t) {
  const out = [];
  if (!t.startDate || !t.endDate) return out;
  let d = new Date(t.startDate + "T00:00:00");
  const end = new Date(t.endDate + "T00:00:00");
  while (d <= end && out.length < 30) {
    out.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`);
    d = new Date(d.getTime() + 86400000);
  }
  return out;
}
function tripStatusTag(t) {
  if (t.status === "archived") return '<span class="tag purple">已归档</span>';
  const today = todayStr();
  if (today < t.startDate) return '<span class="tag blue">规划中</span>';
  if (today > t.endDate) return '<span class="tag orange">待归档</span>';
  return '<span class="tag lo">进行中</span>';
}
function tripMoneyList(t) { return D.money.filter((x) => x.tripId === t.id); }
function tripSpend(t) { return tripMoneyList(t).filter((x) => x.type === "支出").reduce((a, b) => a + b.amount, 0); }

/* AI 通用调用 */
function travelAiReady() { return typeof aiReady === "function" ? aiReady() : !!(D.settings.aiBase && D.settings.aiKey && D.settings.aiModel); }
async function travelAiChat(prompt) { return aiChat(prompt, { temperature: 0.4 }); }
function pickJson(txt) {
  const t = txt.replace(/```json|```/g, "");
  const m = t.match(/[\[{][\s\S]*[\]}]/);
  if (!m) throw new Error("AI 未返回有效 JSON");
  return JSON.parse(m[0]);
}

/* ---------- 主渲染 ---------- */
function renderTravel() {
  if (travelView === "detail" && tripById(curTripId)) renderTripDetail();
  else { travelView = "home"; renderTravelHome(); }
}

/* ========== 旅行首页 ========== */
function renderTravelHome() {
  const trips = [...(D.trips || [])].sort((a, b) => {
    if ((a.status === "archived") !== (b.status === "archived")) return a.status === "archived" ? 1 : -1;
    return (b.startDate || "").localeCompare(a.startDate || "");
  });
  const habits = D.travelHabits || [];
  $("#sec-travel").innerHTML = `
  <div class="card" style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
    <div>
      <div style="font-weight:700;font-size:15px">✈️ 我的旅行</div>
      <div style="font-size:12px;color:var(--text2);margin-top:3px">选城市 → 挑景点 → 智能规划路径与住宿 → 边玩边记账 → 归档沉淀经验</div>
    </div>
    <button class="btn" onclick="openTripWizard()">+ 新建旅行</button>
    <button class="btn ghost" onclick="locateMe()">📍 定位当前位置</button>
    <button class="btn ghost" onclick="showSetupGuide('map')">🗺️ 地图指引</button>
  </div>
  <div class="grid cols-2">
    <div class="card">
      <h3>🗺️ 旅行列表</h3>
      ${trips.length ? trips.map((t) => tripCardHtml(t)).join("") : '<div class="empty">还没有旅行计划，点右上角「新建旅行」开始吧</div>'}
    </div>
    <div class="card">
      <h3>🧭 个人旅行习惯 <span class="more">归档旅行后自动沉淀，AI 规划时自动参考</span></h3>
      <div class="form-row">
        <input id="th-text" placeholder="手动补充习惯，如：不爱早起，上午行程别排太满">
        <button class="btn sm" onclick="addTravelHabit()">添加</button>
      </div>
      ${habits.length ? habits.map((h) => `<div class="list-item">
        <span style="font-size:16px">💡</span>
        <div class="grow"><div class="title" style="font-size:13px">${esc(h.text)}</div><div class="sub">${esc(h.from || "手动添加")} · ${h.date || ""}</div></div>
        <button class="icon-btn" onclick="delTravelHabit('${h.id}')">✕</button></div>`).join("") : '<div class="empty">暂无沉淀的旅行习惯</div>'}
    </div>
  </div>`;
}
function tripCardHtml(t) {
  const spend = tripSpend(t);
  const days = tripDates(t).length;
  return `<div class="list-item" style="cursor:pointer" onclick="openTrip('${t.id}')">
    <span style="font-size:22px">${t.status === "archived" ? "📦" : "🧳"}</span>
    <div class="grow">
      <div class="title"><b>${esc(t.name || t.city)}</b> · ${esc(t.city)}</div>
      <div class="sub">${t.startDate} ~ ${t.endDate}（${days}天）· 景点 ${t.spots.length} 个 · 已花 ${fmtMoney(spend)}${t.status !== "archived" && t.startDate >= todayStr() ? ` · ✈️ 距出发 ${Math.round((new Date(t.startDate + "T00:00:00") - new Date(todayStr() + "T00:00:00")) / 86400000)} 天` : ""}</div>
    </div>
    ${tripStatusTag(t)}
    <span style="color:var(--text2)">›</span>
  </div>`;
}

/* ========== 新建 / 编辑旅行 ========== */
function openTripWizard(id) {
  const t = id ? tripById(id) : null;
  const hotelsTxt = t ? (t.hotels || []).map((h) => [h.name, h.addr, h.from, h.to].filter(Boolean).join(" | ")).join("\n") : "";
  openModal(`<h3>${t ? "✏️ 编辑旅行" : "🧳 新建旅行"}</h3>
    <div class="form-row">
      <div style="flex:1"><label class="fl">旅行名称</label><input id="tw-name" placeholder="如：暑假成都行" value="${t ? esc(t.name) : ""}"></div>
      <div style="flex:1"><label class="fl">目的地城市</label><input id="tw-city" placeholder="如：成都" value="${t ? esc(t.city) : ""}"></div>
    </div>
    <div class="form-row">
      <div style="flex:1"><label class="fl">开始日期</label><input id="tw-start" type="date" value="${t ? t.startDate : todayStr()}"></div>
      <div style="flex:1"><label class="fl">结束日期</label><input id="tw-end" type="date" value="${t ? t.endDate : todayStr()}"></div>
    </div>
    <div class="form-row">
      <div style="flex:1"><label class="fl">到达车站/机场</label><input id="tw-arrive" placeholder="如：成都东站 / 双流机场T2" value="${t ? esc(t.arriveVia) : ""}"></div>
      <div style="flex:0 0 110px"><label class="fl">到达时间</label><input id="tw-arrivetime" type="time" value="${t ? t.arriveTime : "12:00"}"></div>
    </div>
    <div class="form-row">
      <div style="flex:1"><label class="fl">离开车站/机场</label><input id="tw-depart" placeholder="如：成都东站" value="${t ? esc(t.departVia) : ""}"></div>
      <div style="flex:0 0 110px"><label class="fl">出发时间</label><input id="tw-departtime" type="time" value="${t ? t.departTime : "18:00"}"></div>
    </div>
    <div class="form-row">
      <div style="flex:1"><label class="fl">酒店情况</label>
        <select id="tw-hotelmode" onchange="$('#tw-hotels-box').style.display=this.value==='booked'?'block':'none'">
          <option value="auto" ${t && t.hotelMode === "auto" ? "selected" : ""}>还没订酒店（让 AI 根据景点智能推荐最优住宿区）</option>
          <option value="booked" ${t && t.hotelMode === "booked" ? "selected" : ""}>已订好酒店（作为每日出发点和终点）</option>
        </select>
      </div>
    </div>
    <div id="tw-hotels-box" style="display:${t && t.hotelMode === "booked" ? "block" : "none"}">
      <label class="fl">已订酒店（每行一个：酒店名 | 地址 | 入住日期 | 退房日期，多天可换酒店）</label>
      <textarea id="tw-hotels" rows="3" placeholder="如意酒店 | 春熙路 | 2026-08-01 | 2026-08-03&#10;熊猫民宿 | 宽窄巷子 | 2026-08-03 | 2026-08-05">${esc(hotelsTxt)}</textarea>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn" onclick="saveTripWizard('${t ? t.id : ""}')">保存</button>
      <button class="btn gray" onclick="closeModal()">取消</button>
    </div>`);
}
function saveTripWizard(id) {
  const city = $("#tw-city").value.trim();
  const start = $("#tw-start").value, end = $("#tw-end").value;
  if (!city) return toast("请填写目的地城市");
  if (!start || !end || end < start) return toast("请检查旅行日期");
  const hotels = $("#tw-hotels").value.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
    const p = l.split("|").map((x) => x.trim());
    return { name: p[0] || "", addr: p[1] || "", from: p[2] || "", to: p[3] || "" };
  });
  const base = {
    name: $("#tw-name").value.trim() || city + "之行",
    city, startDate: start, endDate: end,
    arriveVia: $("#tw-arrive").value.trim(), arriveTime: $("#tw-arrivetime").value,
    departVia: $("#tw-depart").value.trim(), departTime: $("#tw-departtime").value,
    hotelMode: $("#tw-hotelmode").value, hotels,
  };
  if (id && tripById(id)) {
    Object.assign(tripById(id), base);
    toast("已更新旅行信息，可重新生成规划");
  } else {
    const nt = { id: uid(), ...base, spots: [], plan: null, status: "active", archive: null, created: Date.now() };
    D.trips.push(nt);
    curTripId = nt.id; travelView = "detail";
    // 与倒数日打通：自动建一个出发倒计时
    if (!D.countdowns.some((c) => c.tripId === nt.id)) {
      D.countdowns.push({ id: uid(), title: (base.name || city) + " · 出发", date: start, type: "countdown", emoji: "✈️", tripId: nt.id });
    }
    toast("旅行已创建，去添加想去的景点吧");
  }
  save(); closeModal(); renderTravel();
}
function openTrip(id) { curTripId = id; travelView = "detail"; renderTravel(); }
function backTravelHome() { travelView = "home"; renderTravel(); }
function delTrip(id) {
  openModal(`<h3>⚠️ 删除这次旅行？</h3>
    <div style="font-size:13px;color:var(--text2);margin-bottom:14px">旅行计划将被删除；关联的旅行账单会保留在记账中。建议旅行结束用「归档」代替删除。</div>
    <div style="display:flex;gap:8px">
      <button class="btn danger" onclick="tombstone('${id}');D.countdowns.filter(c=>c.tripId==='${id}').forEach(c=>tombstone(c.id));D.trips=D.trips.filter(t=>t.id!=='${id}');D.countdowns=D.countdowns.filter(c=>c.tripId!=='${id}');save();closeModal();backTravelHome();toast('已删除')">确认删除</button>
      <button class="btn gray" onclick="closeModal()">取消</button>
    </div>`);
}

  const days = tripDates(t).length;
  const list = tripMoneyList(t).sort((a, b) => b.date.localeCompare(a.date));
  const byCat = {};
  list.filter((x) => x.type === "支出").forEach((x) => byCat[x.cat] = (byCat[x.cat] || 0) + x.amount);
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

  $("#sec-travel").innerHTML = `
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button class="btn sm gray" onclick="backTravelHome()">‹ 返回</button>

          📍${esc(t.city)} · ${t.startDate} ~ ${t.endDate}（${days}天）
          ${t.arriveVia ? ` · 🛬 ${esc(t.arriveVia)} ${t.arriveTime}` : ""}
          ${t.departVia ? ` · 🛫 ${esc(t.departVia)} ${t.departTime}` : ""}
        </div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">
          🏨 ${t.hotelMode === "booked" ? (t.hotels.length ? t.hotels.map((h) => esc(h.name)).join("、") : "已订酒店") : "未订酒店 · AI 智能推荐住宿区"}
        </div>
      </div>
      <button class="btn sm ghost" onclick="exportTripView('${t.id}')">🖨 导出</button>
      ${archived ? "" : `<button class="btn sm ghost" onclick="openTripWizard('${t.id}')">编辑</button>
      <button class="btn sm" style="background:var(--teal)" onclick="openArchiveModal('${t.id}')">📦 归档</button>`}
      <button class="btn sm danger" onclick="delTrip('${t.id}')">删除</button>
    </div>
  </div>

  ${archived ? "" : `<div class="card" style="margin-bottom:16px">
    <h3>🌤️ 行程天气 <button class="more" onclick="loadTripWeather(true)">↻ 刷新</button></h3>
    <div id="trip-weather">${t.weather && t.weather.days ? tripWeatherHtml(t) : '<div class="empty">加载中…（免费天气服务，无需配置）</div>'}</div>
  </div>`}

/* ---------- 天气（Open-Meteo 免费接口，无需 Key） ---------- */
const WMO_MAP = { 0: "☀️ 晴", 1: "🌤 多云转晴", 2: "⛅ 多云", 3: "☁️ 阴", 45: "🌫 雾", 48: "🌫 雾凇", 51: "🌦 毛毛雨", 53: "🌦 小雨", 55: "🌧 中雨", 61: "🌦 小雨", 63: "🌧 中雨", 65: "🌧 大雨", 66: "🌧 冻雨", 71: "🌨 小雪", 73: "🌨 中雪", 75: "❄️ 大雪", 80: "🌦 阵雨", 81: "🌧 强阵雨", 82: "⛈ 暴雨", 85: "🌨 阵雪", 95: "⛈ 雷雨", 96: "⛈ 雷雨冰雹", 99: "⛈ 强雷雨" };
async function loadTripWeather(force) {
  const t = tripById(curTripId);
  if (!t) return;
  const box = $("#trip-weather");
  if (!force && t.weather && t.weather.fetched === todayStr()) { if (box) box.innerHTML = tripWeatherHtml(t); return; }
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 10000);
    const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(t.city)}&count=1&language=zh&format=json`, { signal: ctrl.signal }).then((r) => r.json());
    const g = geo.results && geo.results[0];
    if (!g) throw new Error("未找到城市「" + t.city + "」的坐标");
    const wx = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=16`, { signal: ctrl.signal }).then((r) => r.json());
    clearTimeout(timer);
    if (!wx.daily) throw new Error("天气数据获取失败");
    t.weather = {
      fetched: todayStr(), place: g.name,
      days: wx.daily.time.map((d, i) => ({ date: d, code: wx.daily.weather_code[i], max: Math.round(wx.daily.temperature_2m_max[i]), min: Math.round(wx.daily.temperature_2m_min[i]), rain: wx.daily.precipitation_probability_max[i] })),
    };
    save(true);
    if (box) box.innerHTML = tripWeatherHtml(t);
  } catch (e) {
    if (box) box.innerHTML = `<div class="empty">天气获取失败：${esc(e.message)}<br><a href="https://weather.cma.cn/" target="_blank" style="color:var(--primary)">→ 中国天气网查询</a></div>`;
  }
}
function tripWeatherHtml(t) {
  const dates = tripDates(t);
  const inTrip = t.weather.days.filter((d) => dates.includes(d.date));
  const show = inTrip.length ? inTrip : t.weather.days.slice(0, 7);
  const note = inTrip.length ? "" : `<div style="font-size:12px;color:var(--orange);margin-bottom:8px">⚠️ 行程日期超出16天预报范围，先展示近7天天气供参考</div>`;
  const rainDays = inTrip.filter((d) => d.rain >= 60);
  return note + `<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">
    ${show.map((d) => `<div style="flex:none;min-width:86px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px 6px">
      <div style="font-size:11px;color:var(--text2)">${d.date.slice(5)}</div>
      <div style="font-size:20px;margin:4px 0">${(WMO_MAP[d.code] || "🌡").split(" ")[0]}</div>
      <div style="font-size:11px">${(WMO_MAP[d.code] || "").split(" ")[1] || ""}</div>
      <div style="font-size:12px;margin-top:3px"><b>${d.min}~${d.max}°</b></div>
      <div style="font-size:11px;color:${d.rain >= 60 ? "var(--red)" : "var(--text2)"}">💧${d.rain}%</div>
    </div>`).join("")}
  </div>
  ${rainDays.length ? `<div style="font-size:12px;color:var(--red);margin-top:8px">☔ ${rainDays.map((d) => d.date.slice(5)).join("、")} 降雨概率高，建议把室内景点（博物馆/商场）排到这些天</div>` : ""}`;
}

/* ---------- 定位 / 地图 / 附近推荐 ---------- */
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000, toR = (d) => d * Math.PI / 180;
  const dLat = toR(lat2 - lat1), dLng = toR(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toR(lat1)) * Math.cos(toR(lat2)) * Math.sin(dLng / 2) ** 2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}
function pinSvg(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="32" viewBox="0 0 22 32"><path d="M11 0C5 0 0 5 0 11c0 8 11 21 11 21s11-13 11-21C22 5 17 0 11 0z" fill="${color}"/><circle cx="11" cy="11" r="5" fill="#fff"/></svg>`;
  return "data:image/svg+xml," + encodeURIComponent(svg);
}
/* 动态加载腾讯地图 GL JS（使用用户自己的 Key，非 WorkBuddy 代理模式） */
function ensureTMap(cb) {
  if (window.TMap) return cb();
  if (!D.settings.mapKey) return cb(new Error("NO_KEY"));
  if (window.__tmapLoading) { (window.__tmapQueue = window.__tmapQueue || []).push(cb); return; }
  window.__tmapLoading = true;
  const s = document.createElement("script");
  s.src = "https://map.qq.com/api/gljs?v=1.exp&libraries=service&key=" + encodeURIComponent(D.settings.mapKey);
  s.onload = () => { window.__tmapLoading = false; cb(); (window.__tmapQueue || []).forEach((f) => f()); window.__tmapQueue = []; };
  s.onerror = () => { window.__tmapLoading = false; cb(new Error("地图脚本加载失败（检查 Key 或网络）")); };
  document.head.appendChild(s);
}
/* 周边搜索（腾讯地点搜索 SDK） */
function tmapSearch(keyword, loc, radius) {
  return new Promise((resolve, reject) => {
    try {
      const svc = new TMap.service.Search({ pageSize: 20, pageIndex: 1 });
      svc.search({ keyword, location: new TMap.LatLng(loc.lat, loc.lng), radius, autoExtend: false },
        (res) => resolve((res && res.data) || []),
        (err) => reject(new Error((err && err.message) || "搜索失败")));
    } catch (e) { reject(e); }
  });
}
/* 地理编码（城市+名称 -> 经纬度），带缓存 */
function geocodeName(name, city) {
  const key = (city || "") + "|" + name;
  if (geoCache[key]) return Promise.resolve(geoCache[key]);
  return new Promise((resolve) => {
    try {
      const gc = new TMap.service.Geocoder({});
      gc.getLocation({ address: (city ? city + " " : "") + name }, (res) => {
        const l = res && res.result && res.result.location;
        if (l) { const g = { lat: l.lat, lng: l.lng }; geoCache[key] = g; resolve(g); } else resolve(null);
      }, () => resolve(null));
    } catch (e) { resolve(null); }
  });
}
/* 定位我的位置 */
function locateMe() {
  if (!navigator.geolocation) return toast("当前浏览器不支持定位（建议用手机/Chrome 打开本站）");
  toast("正在获取你的位置…");
  navigator.geolocation.getCurrentPosition((pos) => {
    userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy), ts: new Date().toLocaleTimeString("zh-CN") };
    D.settings.lastLoc = { lat: userLoc.lat, lng: userLoc.lng, acc: userLoc.acc, ts: userLoc.ts };
    save(true); renderTripDetail();
    if (D.settings.mapKey) doNearbySearch();
    else toast("✅ 已定位。配置地图 Key 后可推荐附近景点/美食（设置 → 🗺️ 地图配置）");
  }, (err) => {
    const m = err.code === 1 ? "定位被拒绝，请在浏览器允许定位权限后重试"
      : err.code === 2 ? "定位失败（信号弱或不可用，请到开阔处重试）" : "定位超时，请重试";
    toast(m);
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

async function doNearbySearch() {
  if (!userLoc) return toast("请先点「定位我的位置」");
  if (!D.settings.mapKey) { nearbyRes = { notice: "needKey" }; return renderTripDetail(); }
  let kw;
  if (nearbyCtg === "food") kw = "美食";

  if (nearbyCtg === "kw") nearbyKw = kw;
  nearbyLoading = true; renderTripDetail();
  try {
    const res = await tmapSearch(kw, userLoc, nearbyRadius);
    const list = res.map((p) => ({
      name: p.title, addr: p.address || "", cat: p.category || "",
      lat: p.location.lat, lng: p.location.lng,
      dist: haversine(userLoc.lat, userLoc.lng, p.location.lat, p.location.lng),
    })).filter((x) => x.lat);

    const far = list.filter((x) => x.dist > 2000).length;

/* 路线地图（腾讯地图） */
function renderRouteMap(t) {
  const idDetail = "route-map-" + t.id, idModal = "route-map-modal-" + t.id;
  const el = document.getElementById(idDetail) || document.getElementById(idModal);
  if (!el) return;
  [idDetail, idModal].forEach((k) => { if (mapInstances[k]) { try { mapInstances[k].destroy(); } catch (e) {} delete mapInstances[k]; } });
  if (!D.settings.mapKey) { el.innerHTML = '<div class="empty">配置地图 Key 后显示路线地图（设置 → 🗺️ 地图配置）</div>'; return; }
  ensureTMap((err) => {
    if (err) { el.innerHTML = '<div class="empty">地图加载失败：' + (err.message || err) + "</div>"; return; }
    try {
      const center = userLoc ? new TMap.LatLng(userLoc.lat, userLoc.lng) : new TMap.LatLng(39.9, 116.4);
      const map = new TMap.Map(el, { zoom: 12, center });
      mapInstances[el.id] = map;
      const pts = [];
      if (t.arriveVia) pts.push({ name: t.arriveVia, type: "arrive" });
      t.spots.forEach((s) => pts.push({ name: s.name, type: "spot" }));
      if (t.hotelMode === "booked") (t.hotels || []).forEach((h) => pts.push({ name: ((h.name || "") + " " + (h.addr || "")).trim(), type: "checkin" }));
      if (t.departVia) pts.push({ name: t.departVia, type: "depart" });
      if (!pts.length) { el.innerHTML = '<div class="empty">添加景点或到/离站后显示路线</div>'; return; }
      Promise.all(pts.map((p) => geocodeName(p.name, t.city).then((g) => g ? { ...p, lat: g.lat, lng: g.lng } : null).catch(() => null)))
        .then((found) => {
          const geos = found.filter(Boolean);
          const nb = (nearbyRes && nearbyRes.list) ? nearbyRes.list : [];
          if (!geos.length && !nb.length && !userLoc) { el.innerHTML = '<div class="empty">暂无可定位的地点（景点需有名称）</div>'; return; }
          const geometries = geos.map((g, i) => ({ id: String(i), styleId: g.type, position: new TMap.LatLng(g.lat, g.lng), properties: { title: g.name } }));
          nb.forEach((p, i) => { if (p.lat) geometries.push({ id: "nb" + i, styleId: "nearby", position: new TMap.LatLng(p.lat, p.lng), properties: { title: p.name } }); });
          if (userLoc) geometries.push({ id: "me", styleId: "me", position: new TMap.LatLng(userLoc.lat, userLoc.lng), properties: { title: "我的位置" } });
          const paths = geos.map((g) => new TMap.LatLng(g.lat, g.lng));
          new TMap.MultiMarker({ map, geometries, styles: {
            arrive: new TMap.MarkerStyle({ width: 22, height: 32, src: pinSvg("#2bb673") }),
            spot: new TMap.MarkerStyle({ width: 22, height: 32, src: pinSvg("#4f6ef7") }),
            checkin: new TMap.MarkerStyle({ width: 22, height: 32, src: pinSvg("#f59e0b") }),
            depart: new TMap.MarkerStyle({ width: 22, height: 32, src: pinSvg("#ef4444") }),
            nearby: new TMap.MarkerStyle({ width: 20, height: 28, src: pinSvg("#16a34a") }),
            me: new TMap.MarkerStyle({ width: 20, height: 20, src: "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><circle cx="10" cy="10" r="8" fill="%231d4ed8" stroke="%23fff" stroke-width="3"/></svg>') }),
          } });
          if (paths.length > 1) new TMap.MultiPolyline({ map, geometries: [{ id: "r", styleId: "r", paths }], styles: { r: new TMap.PolylineStyle({ color: 0x4f6ef7, width: 5, lineCap: "round" }) } });
          const ctr = userLoc ? new TMap.LatLng(userLoc.lat, userLoc.lng) : (geos[0] ? new TMap.LatLng(geos[0].lat, geos[0].lng) : (nb[0] ? new TMap.LatLng(nb[0].lat, nb[0].lng) : new TMap.LatLng(39.9, 116.4)));
          map.setCenter(ctr);
        });
    } catch (e) { el.innerHTML = '<div class="empty">地图渲染失败：' + esc(e.message) + "</div>"; }
  });
}

  const hotelPart = t.hotelMode === "booked"
    ? `已预订酒店（必须作为对应日期每天的出发点和终点）：\n${t.hotels.map((h) => `- ${h.name}${h.addr ? "（" + h.addr + "）" : ""} ${h.from || t.startDate}入住 至 ${h.to || t.endDate}退房`).join("\n")}`
    : `尚未预订酒店：请根据景点地理分布 + 到达站点（${t.arriveVia || "未知"}）+ 离开站点（${t.departVia || "未知"}），为每天推荐最优住宿区域和具体酒店类型建议；如果分区游览更省时间，允许中途换一次酒店；在每一天的 hotel 字段给出推荐并说明理由。`;
  const habits = travelHabitTexts();
  return `你是专业旅行规划师，请为以下旅行生成逐日最优行程。只返回JSON，不要任何其他文字。

【旅行信息】
城市：${t.city}
日期：${t.startDate} 至 ${t.endDate}，共${days.length}天
到达：${t.startDate} ${t.arriveTime || ""} 抵达 ${t.arriveVia || "（未填写）"}
离开：${t.endDate} ${t.departTime || ""} 从 ${t.departVia || "（未填写）"} 出发（请预留足够赶车/机时间）
${hotelPart}

【想去的景点】
${spots}

${habits.length ? "【我的旅行习惯（历史经验，规划时必须参考）】\n" + habits.map((h) => "- " + h).join("\n") + "\n" : ""}${extra ? "【本次补充要求】\n" + extra + "\n" : ""}
【规划要求】
1. 按地理位置就近原则给景点排序分天，避免走回头路；考虑景点开放时间；第一天从到达站点开始，最后一天以离开站点结束
2. 每天从当天酒店出发、回到当天酒店结束（换酒店日先退房寄存/带行李）
3. 相邻两点之间给出 transit 项：具体出行方式（地铁x号线/公交/步行/打车）、预计费用costYuan(元)与耗时minutes(分钟)
4. 每天安排午餐/晚餐 meal 项，优先当地特色/景点周边美食，给预计人均费用
5. spot 项给出预计游玩minutes与门票costYuan
6. 严格按此JSON输出：
{"days":[{"date":"YYYY-MM-DD","hotel":{"name":"酒店名或推荐住宿区","area":"商圈/区域","reason":"选择理由(未订酒店时必填)"},"items":[{"start":"09:00","end":"10:30","type":"arrive|checkin|spot|transit|meal|free|depart","name":"名称","transport":"出行方式(transit项必填)","costYuan":0,"minutes":0,"tip":"提示(可选)"}],"dayCostYuan":0}],"hotelStrategy":"整体住宿策略一句话","totalCostYuan":0,"tips":["3-5条本次行程实用建议"]}`;
}
function basicPlan(t) {
  const days = tripDates(t);
  const per = Math.ceil(t.spots.length / Math.max(days.length, 1));
  let idx = 0;
  const dayObjs = days.map((date, di) => {
    const items = [];
    if (di === 0 && t.arriveVia) items.push({ start: t.arriveTime || "12:00", end: "", type: "arrive", name: "抵达 " + t.arriveVia, costYuan: 0, minutes: 0 });
    if (di === 0) items.push({ start: "", end: "", type: "checkin", name: t.hotelMode === "booked" && t.hotels[0] ? "入住 " + t.hotels[0].name : "入住酒店（建议订在景点集中区域）", costYuan: 0, minutes: 0 });
    let h = di === 0 ? 14 : 9;
    for (let k = 0; k < per && idx < t.spots.length; k++, idx++) {
      const s = t.spots[idx];
      if (k > 0 || di > 0) items.push({ start: "", end: "", type: "transit", name: "前往 " + s.name, transport: "地铁/打车", costYuan: 15, minutes: 30 });
      items.push({ start: `${pad(h)}:00`, end: `${pad(Math.min(h + 2, 22))}:00`, type: "spot", name: s.name, costYuan: 0, minutes: 120, tip: s.info?.tip || "" });
      h = Math.min(h + 3, 20);
    }
    items.push({ start: "18:30", end: "", type: "meal", name: "晚餐 · 当地特色（待定）", costYuan: 60, minutes: 60 });
    if (di === days.length - 1 && t.departVia) items.push({ start: t.departTime || "18:00", end: "", type: "depart", name: "前往 " + t.departVia + " 返程", transport: "地铁/打车", costYuan: 20, minutes: 40 });
    return { date, hotel: { name: t.hotelMode === "booked" ? (t.hotels[0]?.name || "已订酒店") : "建议住景点集中区/交通枢纽附近", area: "", reason: "" }, items, dayCostYuan: items.reduce((a, b) => a + (+b.costYuan || 0), 0) };
  });
  return { days: dayObjs, hotelStrategy: t.hotelMode === "booked" ? "按已订酒店安排" : "未配置AI，仅给出通用建议：优先住地铁沿线、景点密集区", totalCostYuan: dayObjs.reduce((a, b) => a + b.dayCostYuan, 0), tips: ["这是基础排期（未配置 AI）。到「设置→AI 配置」填写接口后重新生成，可获得最优路径、真实票价与美食推荐。"], mode: "basic", generatedAt: todayStr() };
}
function planHtml(t) {
  const p = t.plan;
  return `
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <span class="tag ${p.mode === "ai" ? "blue" : "orange"}">${p.mode === "ai" ? "AI 智能规划" : "基础排期"} · ${p.generatedAt || ""}</span>
    ${p.totalCostYuan ? `<span class="tag teal">预计总花费 ¥${Math.round(p.totalCostYuan)}</span>` : ""}
  </div>
  ${p.hotelStrategy ? `<div style="font-size:13px;background:var(--primary-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px">🏨 <b>住宿策略：</b>${esc(p.hotelStrategy)}</div>` : ""}
  <div class="grid cols-2">
  ${p.days.map((d, i) => `
    <div style="border:1px solid var(--line);border-radius:12px;padding:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <b>Day ${i + 1} · ${d.date}</b>
        ${d.dayCostYuan ? `<span class="tag hi">约 ¥${Math.round(d.dayCostYuan)}</span>` : ""}
      </div>
      ${d.hotel && d.hotel.name ? `<div style="font-size:12px;color:var(--text2);margin-bottom:8px">🏨 ${esc(d.hotel.name)}${d.hotel.area ? " · " + esc(d.hotel.area) : ""}${d.hotel.reason ? `<br><span style="color:var(--primary)">↳ ${esc(d.hotel.reason)}</span>` : ""}</div>` : ""}
      <div class="tl">
        ${(d.items || []).map((it) => `
        <div class="tl-item ${it.type === "transit" ? "transit" : ""}">
          <div style="font-size:13px">
            ${it.start ? `<b style="color:var(--primary)">${it.start}${it.end ? "-" + it.end : ""}</b> ` : ""}
            ${TL_ICONS[it.type] || "•"} ${esc(it.name)}
            ${it.transport ? `<span class="chip">${esc(it.transport)}</span>` : ""}
          </div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px">
            ${it.minutes ? "约" + it.minutes + "分钟" : ""}${it.costYuan ? " · ¥" + it.costYuan : ""}${it.tip ? " · 💡" + esc(it.tip) : ""}
          </div>
        </div>`).join("")}
      </div>
    </div>`).join("")}
  </div>
  ${p.tips?.length ? `<div style="margin-top:12px;font-size:13px"><b>📌 出行建议</b><ul style="margin:6px 0 0 18px;line-height:1.9;color:var(--text2)">${p.tips.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}`;
}

/* ---------- 旅行记账 ---------- */
function addTripMoney() {
  const amount = parseFloat($("#tm-amount").value);
  if (!amount || amount <= 0) return toast("请输入金额");
  const t = tripById(curTripId);
  D.money.push({
    id: uid(), date: $("#tm-date").value || todayStr(), type: "支出",
    cat: $("#tm-cat").value, amount, note: $("#tm-note").value.trim(),
    tripId: t.id, inTotal: $("#tm-intotal").checked,
  });
  save(); renderTripDetail(); toast($("#tm-intotal").checked ? "已记账（计入总账）" : "已记账（仅旅行账本，不计入总账）");
}
function toggleTripMoneyTotal(id) {
  const x = D.money.find((m) => m.id === id);
  if (x) { x.inTotal = x.inTotal === false ? true : false; save(); renderTripDetail(); toast(x.inTotal ? "已计入总账" : "已从总账中排除"); }
}
function delTripMoney(id) { tombstone(id); D.money = D.money.filter((x) => x.id !== id); save(); renderTripDetail(); }

/* ---------- 归档与习惯沉淀 ---------- */
function openArchiveModal(id) {
  const t = tripById(id);
  const actual = tripSpend(t);
  openModal(`<h3>📦 归档「${esc(t.name)}」</h3>
    <div style="font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:10px">
      本次旅行共 ${tripDates(t).length} 天 · ${t.spots.filter((s) => s.done).length}/${t.spots.length} 个景点已打卡 · 实际花费 <b>${fmtMoney(actual)}</b><br>
      写下这次的经验教训，会沉淀为你的「旅行习惯」，下次做计划时 AI 自动参考迭代优化。
    </div>
    <label class="fl">本次旅行经验（每行一条，如：一天安排别超过3个景点 / 提前一周抢门票）</label>
    <textarea id="ar-exp" rows="5" placeholder="例：&#10;博物馆类要提前3天预约&#10;当地打车比地铁更划算&#10;下次订酒店优先地铁站500米内"></textarea>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn" onclick="archiveTrip('${t.id}')">确认归档</button>
      <button class="btn gray" onclick="closeModal()">取消</button>
    </div>`);
}
function archiveTrip(id) {
  const t = tripById(id);
  const exp = $("#ar-exp").value.trim();
  t.status = "archived";
  t.archive = { date: todayStr(), experience: exp, actualCost: tripSpend(t) };
  if (exp) {
    exp.split("\n").map((l) => l.trim()).filter(Boolean).forEach((line) => {
      D.travelHabits.push({ id: uid(), text: line, from: t.name, date: todayStr() });
    });
  }
  save(); closeModal(); renderTripDetail();
  toast("已归档 🎉 经验已沉淀到「个人旅行习惯」");
}
function addTravelHabit() {
  const v = $("#th-text").value.trim();
  if (!v) return toast("请输入内容");
  D.travelHabits.push({ id: uid(), text: v, from: "手动添加", date: todayStr() });
  save(); renderTravelHome();
}
function delTravelHabit(id) { tombstone(id); D.travelHabits = D.travelHabits.filter((h) => h.id !== id); save(); renderTravelHome(); }

const XHS_KEY_PRIORITY = ["ai", "finance", "food", "travel", "baby", "film", "exam", "growth", "social", "city"];

function xhsAutoClassify(title) {
  const t = String(title || "").toLowerCase();
  if (!t.trim()) return null;
  let best = null, bestScore = 0;
  for (const id of XHS_KEY_PRIORITY) {
    const kws = XHS_KEYWORDS[id] || [];
    let score = 0;
    const seen = new Set();
    for (const kw of kws) {
      if (seen.has(kw)) continue;
      seen.add(kw);
      if (t.includes(kw.toLowerCase())) score++;
    }
    if (score > bestScore) { bestScore = score; best = id; }
  }
  return bestScore > 0 ? best : null;
}
// 把 CSV 里的分类字符串解析成稳定 id：已知 id / 已知名称 → 复用；自定义名称 → 新建分类；空 → 关键词自动归类
function xhsResolveCat(raw, title) {
  raw = String(raw || "").trim();
  if (!raw || raw === "default" || raw === "默认") return xhsAutoClassify(title) || "default";
  if (D.xhsCats.find((c) => c.id === raw)) return raw;
  const byName = D.xhsCats.find((c) => c.name === raw);
  if (byName) return byName.id;
  const id = "c-" + uid().slice(0, 6);
  D.xhsCats.push({ id, name: raw });
  return id;
}

/* ---------- 数据存取 ---------- */
function xhsEnsure() {
  if (!Array.isArray(D.xhsNotes)) D.xhsNotes = [];
  if (!Array.isArray(D.xhsCats)) D.xhsCats = [];
}
function xhsCatName(id) {
  if (id === "all") return "全部";
  if (id === "default") return "默认";
  const c = D.xhsCats.find((c) => c.id === id);
  return c ? c.name : id;
}
function xhsSeedIfEmpty() {
  xhsEnsure();
  // 示例数据只播种一次（持久标记，随云同步走）。否则"全选删光"会立刻触发重新播种，
  // 31 条示例以新 id 复活，看起来像"删除被云同步撤销"（2026-10-05 修复）。
  if (D.settings.xhsSeeded) return;
  // 老用户已有数据但尚无标记：补标记即可，不再播种
  if (D.xhsNotes.length || D.xhsCats.length) { D.settings.xhsSeeded = true; save(true); return; }
  if (!D.xhsCats.length && XHS_SEED.cats.length) {
    D.xhsCats = XHS_SEED.cats.map((c) => ({ id: c.id, name: c.name }));
  }
  if (!D.xhsNotes.length && XHS_SEED.notes.length) {
    const now = Date.now();
    D.xhsNotes = XHS_SEED.notes.map((n, i) => ({
      id: uid(),
      title: n.title || "",
      author: n.author || "",
      likes: Number(n.likes) || 0,
      cat: n.cat || "default",
      url: n.url || "",
      tags: n.tags || "",
      date: new Date(now - i * 86400000).toISOString().slice(0, 10),
      memo: n.memo || "",
      desc: "",
      created: now - i * 1000,
      updatedAt: now - i * 1000,
    }));
    D.settings.xhsSeeded = true;
    save(true);
  }
}

/* ---------- 过滤 / 排序 ---------- */
function xhsFiltered() {
  let list = D.xhsNotes.slice();
  if (xhsCat !== "all") list = list.filter((n) => (n.cat || "default") === xhsCat);
  const q = xhsQ.trim().toLowerCase();
  if (q) {
    list = list.filter((n) =>
      (n.title || "").toLowerCase().includes(q) ||
      (n.author || "").toLowerCase().includes(q) ||
      (n.tags || "").toLowerCase().includes(q) ||
      (n.memo || "").toLowerCase().includes(q) ||
      (n.desc || "").toLowerCase().includes(q));
  }
  if (xhsTag) {
    const t = xhsTag;
    list = list.filter((n) => (n.tags || "").split(/[,，;]/).map((s) => s.trim()).filter(Boolean).includes(t));
  }
  if (xhsSort === "likes") list.sort((a, b) => (b.likes || 0) - (a.likes || 0));
  else if (xhsSort === "recent") list.sort((a, b) => (b.updatedAt || b.created || 0) - (a.updatedAt || a.created || 0));
  else if (xhsSort === "title") list.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  return list;
}
// 全部笔记按当前排序（用于导出）
function xhsSortedAll() {
  const list = D.xhsNotes.slice();
  if (xhsSort === "likes") list.sort((a, b) => (b.likes || 0) - (a.likes || 0));
  else if (xhsSort === "recent") list.sort((a, b) => (b.updatedAt || b.created || 0) - (a.updatedAt || a.created || 0));
  else if (xhsSort === "title") list.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  return list;
}
function xhsAllTags() {
  const m = new Map();
  D.xhsNotes.forEach((n) => {
    (n.tags || "").split(/[,，;]/).map((s) => s.trim()).filter(Boolean)
      .forEach((t) => m.set(t, (m.get(t) || 0) + 1));
  });
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
function xhsCatCount(id) {
  if (id === "all") return D.xhsNotes.length;
  return D.xhsNotes.filter((n) => (n.cat || "default") === id).length;
}
function xhsRecentList(n) {
  return (D.xhsNotes || []).slice()
    .sort((a, b) => (b.updatedAt || b.created || 0) - (a.updatedAt || a.created || 0))
    .slice(0, n);
}

/* ---------- 卡片 ---------- */
function xhsLikeFmt(n) {
  const v = n.likes || 0;
  return v >= 10000 ? (v / 10000).toFixed(1) + "w" : String(v);
}
function xhsCardHtml(n) {
  const tags = (n.tags || "").split(/[,，;]/).map((s) => s.trim()).filter(Boolean);
  const note = n.memo || n.desc || "";
  const sel = xhsSelected.has(n.id);
  const topRight = xhsMulti
    ? `<input type="checkbox" class="xhs-sel" data-sel="${esc(n.id)}" ${sel ? "checked" : ""} title="选择">`
    : `<button class="icon-btn" data-del="${esc(n.id)}" title="删除">✕</button>`;
  return `<div class="xhs-card${xhsMulti ? " multi" : ""}${sel ? " selected" : ""}" data-id="${esc(n.id)}"${xhsMulti ? ' draggable="true"' : ""}>
    <div class="xhs-card-top">
      <span class="xhs-cat">${esc(xhsCatName(n.cat))}</span>
      ${topRight}
    </div>
    <a class="xhs-title" href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(n.title)}</a>
    <div class="xhs-meta"><span>${esc(n.author || "匿名")}</span>${n.date ? `<span class="xhs-date">📅 ${esc(n.date)}</span>` : ""}<span class="xhs-like">❤ ${xhsLikeFmt(n)}</span></div>
    ${note ? `<p class="xhs-note">${esc(note)}</p>` : ""}
    ${tags.length ? `<div class="xhs-tags-in">${tags.map((t) => `<span class="tag" data-tag="${esc(t)}">${esc(t)}</span>`).join("")}</div>` : ""}
    ${xhsMulti ? "" : `<button class="btn ghost sm xhs-edit" data-pick="${esc(n.id)}">编辑</button>`}
  </div>`;
}

function buildXhsShell(root) {
  root.innerHTML = `
    <div class="xhs-tool">
      <input id="xhs-search" class="inp" placeholder="搜索标题 / 作者 / 标签 / 批注…">
